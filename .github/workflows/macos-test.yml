name: macOS Tests

on:
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  macos-test:
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS example
        run: flutter build macos --debug --no-pub

      - name: Run native macOS tests
        run: |
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/macos-tests \
            -quiet test
