name: flutter_device_apps_macos
description: Independent macOS app discovery and management APIs for Flutter.
version: 0.1.0
publish_to: none

homepage: https://github.com/okmsbun/flutter_device_apps
issue_tracker: https://github.com/okmsbun/flutter_device_apps/issues
topics:
  - installed-apps
  - app-management
  - package-manager

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterDeviceAppsMacosPlugin
